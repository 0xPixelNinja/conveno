name: Feature request
description: Suggest a change or an addition
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance
      options:
        - label: This does not need Conveno to read provider credentials, drive a CLI under someone else's login, or run anything on a schedule.
          required: true
