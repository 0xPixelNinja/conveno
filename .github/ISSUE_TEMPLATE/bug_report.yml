name: Bug report
description: Something does not work as documented
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use the Security tab, as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Conveno version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "24.x"
  - type: input
    id: cli
    attributes:
      label: CLIs involved and their versions
      placeholder: "Claude Code 2.x, Codex 0.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `conveno doctor` and relevant log lines. Remove secrets and private paths first.
      render: text
