<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 120" width="384" height="240" role="img" aria-label="The orchestrator point moves to another session">
<style>
:root{--k:#111B28;--e:#2346D9;--q:#566474;--r:#C7D0DA;--st:#9A5700;--ok:#1E7B3A;--er:#B3202A}
@media (prefers-color-scheme:dark){:root{--k:#E4EAF1;--e:#8CA6FF;--q:#93A1B3;--r:#2A384A;--st:#FFB547;--ok:#7BD88F;--er:#F2777A}}
.k{fill:var(--k)}.e{fill:var(--e)}
.pt{animation:m .56s cubic-bezier(.65,0,.25,1) .12s both}.o1{animation:o .2s cubic-bezier(.4,0,1,1) both}.o3{animation:i .2s cubic-bezier(.2,.7,.1,1) .68s both}
@keyframes m{from{transform:translateY(-80px)}}@keyframes o{from{opacity:1}}@keyframes i{from{opacity:0}}
.s{fill:none;stroke:var(--r);stroke-width:1.5}.l{fill:var(--r)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
